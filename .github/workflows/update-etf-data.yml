name: Update ETF Data

on:
  schedule:
    # Every 30 minutes during market hours (9:30am–4pm ET = 13:30–20:00 UTC, Mon–Fri)
    - cron: '*/30 13-20 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'update_etf_data.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch ETF data
        run: python update_etf_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-data.json
          if git diff --cached --quiet; then
            echo "No changes to etf-data.json"
          else
            git commit -m "Update ETF data [skip ci]"
            git push
          fi